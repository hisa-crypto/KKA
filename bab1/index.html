<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Berpikir Komputasional – Bab 1</title>
<style>
:root{--bg:#fdf3dc;--ink:#26204a;--card:#fffdf7;--line:#26204a;--blue:#3b82f6;--org:#f97316;--grn:#16a34a;--sun:#ffc93c;--mute:#6b6590;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1738;--ink:#fff4dc;--card:#2a2456;--line:#fff4dc;--mute:#b9b2e0}}
:root[data-theme="dark"]{--bg:#1b1738;--ink:#fff4dc;--card:#2a2456;--line:#fff4dc;--mute:#b9b2e0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:18px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;max-width:900px;margin:0 auto}
header b{font-size:20px}
#sc{background:var(--sun);color:#26204a;border-radius:99px;padding:6px 16px;font-weight:700;border:3px solid var(--line)}
main{max-width:900px;margin:0 auto;padding:0 18px 40px}
h1{font-size:clamp(28px,6vw,44px);margin:8px 0}
h2{font-size:clamp(22px,4.5vw,30px);margin:10px 0}
.sub,.intro{color:var(--mute);margin:4px 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mb{position:relative;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--line);display:grid;gap:2px}
.mb>span{font-size:38px}.mb small{font-size:15px;color:var(--mute)}.mb em{position:absolute;right:12px;top:10px;font-style:normal;font-size:26px}
.mb:hover{transform:translateY(-2px)}.mb:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.top{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.back{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:6px 12px}
.top span{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.pc{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 5px 0 var(--line);display:grid;gap:4px;justify-items:center}
.pc svg{width:100%;max-width:130px}
.pc:hover{transform:translateY(-2px)}
.pc.ok{background:#bbf7d0;color:#14532d}
.msg{min-height:30px;font-weight:700;margin:10px 0}
.msg.good{color:var(--grn)}.msg.bad{color:var(--org)}
.stage{position:relative;height:340px;background:var(--card);border:3px solid var(--line);border-radius:18px;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default}
.tg{position:absolute;width:90px;text-align:center;font-size:58px;line-height:1.1;cursor:pointer;animation:fl 2s ease-in-out infinite}
.tg i{display:block;font-style:normal;font-size:14px;font-weight:700;color:#fff;border-radius:99px;padding:2px 8px;margin-top:2px}
.tg.pop{animation:pop .45s forwards;pointer-events:none}
.tg.wig{animation:wig .35s}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes pop{40%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(0);opacity:0}}
@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.shake{animation:wig .35s}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.hud svg{width:56px}
.bar{height:14px;background:var(--card);border:3px solid var(--line);border-radius:99px;width:min(220px,50vw);overflow:hidden}
.bar div{height:100%;background:var(--grn);width:0;transition:width .3s}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:22px;text-align:center;box-shadow:0 6px 0 var(--line)}
.big{font-size:72px}
.go{background:var(--sun);color:#26204a;border:3px solid var(--line);border-radius:14px;padding:10px 22px;font-weight:700;box-shadow:0 4px 0 var(--line);margin-top:10px}
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.learn .pc{cursor:default;text-align:center}.learn p{margin:0;font-size:15px}
.bigmouse{width:min(260px,70vw);display:block;margin:10px auto}
.bigmouse path{cursor:pointer;transition:fill .15s}
.opts{display:grid;gap:10px;margin-top:10px}
.opts button{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.opts button.ok{background:#bbf7d0;color:#14532d}
.f{display:grid;gap:12px;max-width:340px;margin:14px auto;text-align:left}
.f input,.f select,#fl{display:block;width:100%;font:inherit;padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:4px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:16px;background:var(--card)}
#fl{width:auto;display:inline-block;margin:0}small{font-size:13px;color:var(--mute)}
th,td{border:2px solid var(--line);padding:6px 8px;text-align:left}
textarea{width:100%;height:140px;font:14px monospace;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:18px;z-index:9}
.ov .card{max-width:360px;width:100%}.bt{display:flex;gap:10px;justify-content:center;margin-top:10px}.bt .go{margin-top:0}
.ov input{font:inherit;width:100%;padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.en{display:block}.id{display:block;font-size:.72em;font-weight:400;color:var(--mute);margin-top:2px}
body.noid .id{display:none}.tg i .id{color:#fff;font-size:11px;margin:0}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--blue);text-align:center;color:var(--blue);font-weight:700;padding:0 6px}.blank.f{border-bottom-color:var(--grn);color:var(--grn)}
.sent{font-size:clamp(20px,4.2vw,30px);line-height:1.6;margin:10px 0}.sent .id{line-height:1.5}
.mb.wide{width:100%;margin-top:14px}#lg{padding:4px 10px;margin-right:8px}
.pc{position:relative}.pc.sel{background:#bbf7d0;color:#14532d}.pc.sel::after{content:"✓";position:absolute;top:4px;right:10px;font-size:28px;color:#16a34a}
.opts button.dim{opacity:.4;text-decoration:line-through;cursor:not-allowed}.opts.lk{pointer-events:none}.opts.lk button:not(.dim){opacity:.6}
.go:disabled{opacity:.5;cursor:not-allowed}
.desk{position:relative;height:340px;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#60a5fa,#a78bfa);user-select:none;-webkit-user-select:none;cursor:default}
.ic{position:absolute;width:104px;text-align:center;padding:6px;border:2px solid transparent;border-radius:8px;color:#fff;font-size:14px;text-shadow:0 1px 2px #0008}
.ic svg{width:60px;display:block;margin:0 auto 4px}.ic.sel{background:rgba(255,255,255,.3);border-color:#fff}
.win{position:absolute;left:150px;right:12px;top:12px;background:#fff;color:#111;border:2px solid #333;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:3}
.win .tb{display:flex;justify-content:space-between;align-items:center;background:#e5e7eb;padding:4px 8px;font-size:14px;font-weight:700}
.win .tb button{background:#ef4444;color:#fff;border:0;border-radius:6px;font-weight:700;padding:2px 10px}
.win .bd{padding:8px;height:210px;overflow:hidden}
.sh{border-collapse:collapse;width:100%;font-size:14px;background:#fff;color:#111}.sh th,.sh td{border:1px solid #d0d7de;padding:3px 8px;text-align:left;font-weight:400}.sh th{background:#f1f3f4;color:#555}
.cm{position:absolute;z-index:5;background:#fff;color:#111;border:1px solid #888;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.35);padding:4px 0;min-width:160px;font-size:15px}
.cm div{padding:4px 16px}.cm div:hover{background:#dbeafe}.cm hr{border:0;border-top:1px solid #ddd;margin:3px 0}
.ck-list{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:6px}.ck-list li{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:6px 12px}.ck-list li.dn{background:#bbf7d0;color:#14532d}
:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qe{font-size:64px;text-align:center;line-height:1.1}
.sl{margin:6px 0;padding-left:28px}.sl li{background:#bbf7d0;color:#14532d;border:3px solid var(--line);border-radius:12px;padding:6px 12px;margin:6px 0;font-weight:700}
#lg{display:none!important}.learn .pc b{font-size:17px}
</style></head><body>
<header><b>💻 Berpikir Komputasional</b><span><button id="lg" class="back" aria-pressed="true" title="Bahasa Indonesia">ID ✓</button><span id="sc">⭐ 0</span></span></header>
<main id="app"></main>
<script>
const A=document.getElementById('app'),SC=document.getElementById('sc');
let stars=0,done={},ms={},cur=0,flt='',me=null,et=null;
const MM=[8,8,8,8,8,8],MN=['M1 Pilar','M2 Pecah & Pola','M3 Abstraksi & Algoritma','M4 Manfaat','M5 Masalah','M6 Pecahkan'],KLS=['Edelweiss','Heliconia','Magnolia','Oleander'],MAX=48,KEY='bab1_results';let mem=[];
/* Alamat Google Apps Script (Web app, berakhiran /exec). Kosong = pengiriman ke Google Sheet mati. */
const SYNC=(()=>{try{const s=new URLSearchParams(location.search).get('s')||'';return /^https:\/\/script\.google\.com\/[^\s"'<>]*\/exec$/.test(s)?s:''}catch(e){return ''}})();
const BEBAS=!SYNC;/* tanpa ?s=alamat_skrip: mode bebas, hasil hanya di perangkat ini */
const TAB='Bab 1'; /* nama tab di Google Sheet */
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const bi=(en,id)=>id||en;
const rec=()=>(ms[cur]=ms[cur]||{s:0,x:0});
const recalc=()=>{stars=0;for(const k in ms)stars+=ms[k].s;SC.textContent='⭐ '+stars};
const add=n=>{rec().s+=n||1;recalc()};
function snd(f,d){try{const c=snd.c||(snd.c=new(window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.12))}catch(e){}}
const ok=()=>{snd(660);setTimeout(()=>snd(880),90)},no=()=>{rec().x++;snd(180,.2)};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const msg=(en,id,g)=>{const m=A.querySelector('#msg');if(m){m.innerHTML=bi(en,id);m.className='msg '+(g?'good':'bad')}};
const shake=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const goBack=()=>me?home():start();
const hdr=t=>`<div class="top"><button class="back" onclick="goBack()">⬅ Menu</button><span>${t}</span></div>`;
const setLang=on=>{document.body.classList.toggle('noid',!on);const b=document.getElementById('lg');b.textContent=on?'ID ✓':'ID ✕';b.setAttribute('aria-pressed',on)};
document.getElementById('lg').onclick=()=>setLang(document.body.classList.contains('noid'));

const e1=r=>r.e&&r.e.done?`Hari ini aku belajar bahwa ${r.e.p} dipakai untuk ${r.e.f}.`:'';
const e2=r=>r.e&&r.e.done?`Satu masalah sehari-hari yang bisa aku pecahkan adalah ${r.e.a}.`:'';
const eall=r=>r.e&&r.e.done?(r.e.all||[r.e.a]).join(', '):'';
const HD=['Nama','Kelas'].concat(...MN.map(n=>[n+' Bintang',n+' Salah']),['Misi Selesai','Total Bintang','Maks','Exit Ticket 1','Exit Ticket 2','Exit Ticket Masalah Dipilih','Exit Ticket Salah Pilih','Exit Ticket Jawaban Ditunjukkan','Waktu']);
const rowOf=r=>[r.nama,r.kelas].concat(...MM.map((_,i)=>{const m=(r.m||[])[i];return m&&(m.d||m.s||m.x)?[m.s,m.x]:['','']}),[r.misi||0,r.bintang,MAX,e1(r),e2(r),eall(r),r.e&&r.e.done?r.e.x:'',r.e&&r.e.h?'Ya':'',r.waktu]);

/* kirim ke Google Sheet (antrean; dicoba ulang otomatis) */
const QK='bab1_queue';let qmem={},sending=0;
const qload=()=>{try{return JSON.parse(localStorage.getItem(QK)||'{}')}catch(e){return qmem}};
const qsave=q=>{qmem=q;try{localStorage.setItem(QK,JSON.stringify(q))}catch(e){}};
async function flush(){
 if(!SYNC||sending)return;sending=1;
 try{
  const q=qload();
  for(const id of Object.keys(q)){
   await fetch(SYNC,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tab:TAB,head:['ID'].concat(HD),row:q[id]})});
   const q2=qload();if(JSON.stringify(q2[id])===JSON.stringify(q[id]))delete q2[id];qsave(q2);
  }
 }catch(e){}
 sending=0}
function queue(r){if(!SYNC)return;const q=qload();q[r.id]=[r.id].concat(rowOf(r));qsave(q);flush()}
setInterval(flush,30000);window.addEventListener('online',flush);

/* penyimpanan */
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return mem}};
const store=a=>{mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
function save(){if(!me)return;const a=load(),r={id:me.id,nama:me.nama,kelas:me.kelas,bintang:stars,misi:Object.keys(done).length,m:[0,1,2,3,4,5].map(i=>({d:done[i]?1:0,s:(ms[i]||{}).s||0,x:(ms[i]||{}).x||0})),e:et,waktu:stamp()};const j=a.findIndex(x=>x.id===me.id);j<0?a.push(r):a[j]=r;store(a);queue(r)}

/* awal */
/* daftar kelas dan siswa dari Google Sheet (tab "Siswa") */
let ROS=null;const RK='kka_roster';
async function loadRos(){
 if(SYNC){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);
  const r=await fetch(SYNC+(SYNC.indexOf('?')<0?'?':'&')+'aksi=siswa',{signal:c.signal});clearTimeout(t);
  const j=await r.json();if(j&&j.kelas&&Object.keys(j.kelas).length){ROS=j.kelas;try{localStorage.setItem(RK,JSON.stringify(ROS))}catch(e){}}}catch(e){}}
 if(!ROS){try{ROS=JSON.parse(localStorage.getItem(RK))}catch(e){}}
 return ROS}
const kls=()=>ROS?Object.keys(ROS):KLS;
function start(){
 done={};ms={};me=null;et=null;recalc();setLang(false);
 if(ROS||!SYNC){form();loadRos();return}
 A.innerHTML='<div class="card"><div class="big">📋</div><h1>Memuat daftar kelas…</h1></div>';
 loadRos().then(form)}
function form(){
 const B=BEBAS;
 A.innerHTML=`<div class="card"><div class="big">👋</div><h1>Halo! Siapa namamu?</h1>${B?'<div class="sent">🆓 Mode bebas: hasilmu hanya tersimpan di perangkat ini dan tidak dikirim ke guru.</div>':''}<div class="f">${B?'':`<label>Kelas<select id="kl"><option value="">Pilih</option>${kls().map(k=>`<option>${esc(k)}</option>`).join('')}</select></label>`}<label>Nama<span id="nw"></span></label></div><p id="msg" class="msg"></p><button class="go" id="go">Mulai bermain</button></div>${B?'':'<p style="text-align:center;margin-top:18px"><button class="back" id="gr">Untuk guru</button></p>'}`;
 const kl=B?null:A.querySelector('#kl'),nw=A.querySelector('#nw');
 const nm=()=>{const s=A.querySelector('#nms');return s&&s.value!=='__lain'?s.value:(A.querySelector('#nmt')||{value:''}).value.trim()};
 const go=()=>{const n=nm(),k=B?'Bebas':kl.value;if(!k){msg('','Pilih kelasmu dulu ya.');return}if(!n){msg('','Pilih atau tulis namamu dulu ya.');return}me={id:'S'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),nama:n,kelas:k};save();home()};
 const draw=()=>{const L=!B&&ROS&&ROS[kl.value];
  if(L&&L.length){nw.innerHTML=`<select id="nms"><option value="">Pilih namamu</option>${L.map(n=>`<option>${esc(n)}</option>`).join('')}<option value="__lain">Namaku tidak ada di daftar</option></select><input id="nmt" maxlength="30" autocomplete="off" placeholder="Tulis namamu" style="display:none;margin-top:6px">`;
   const s=A.querySelector('#nms');s.onchange=()=>{A.querySelector('#nmt').style.display=s.value==='__lain'?'':'none'}}
  else nw.innerHTML='<input id="nmt" maxlength="30" autocomplete="off">';
  A.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()})};
 if(kl)kl.onchange=draw;draw();
 A.querySelector('#go').onclick=go;
 const g=A.querySelector('#gr');if(g)g.onclick=teacher;
}
function dlg(text,yes,label){
 const o=$(`<div class="ov"><div class="card"><p>${text}</p><div class="bt"></div></div></div>`);
 const y=$(`<button class="go">${label||'Ya'}</button>`),n=$('<button class="back">Batal</button>');
 y.onclick=()=>{o.remove();yes()};n.onclick=()=>o.remove();
 o.querySelector('.bt').append(y,n);document.body.append(o)}
function gantiSiswa(){stars?dlg('Ganti siswa? Skor ini sudah tersimpan.',start,'Ya, ganti'):start()}
function teacher(){location.href='../laporan/?s='+encodeURIComponent(SYNC)}
/* ===== Bab 1: konten ===== */
const PIL={dek:['🧩','Dekomposisi','memecah masalah besar menjadi bagian-bagian kecil'],pol:['🔍','Pengenalan Pola','mencari kesamaan atau pengulangan'],abs:['🎯','Abstraksi','mengambil hal yang penting dan mengabaikan yang tidak perlu'],alg:['📋','Algoritma','menyusun langkah-langkah secara berurutan']};
const pp=k=>[PIL[k][1]].concat(Object.keys(PIL).filter(x=>x!==k).map(x=>PIL[x][1]));
const L=k=>[PIL[k][0],PIL[k][1],PIL[k][2][0].toUpperCase()+PIL[k][2].slice(1)+'.'];
/* item pilihan: {q,e,o:[jawaban benar dulu, ...salah],w}  |  item urutan: {q,e,s:[langkah berurutan]} */
const MS=[
['🧠','Kenali 4 Pilar','Dekomposisi, pola, abstraksi, algoritma','Kenali 4 pilar berpikir komputasional. Baca kartunya, lalu tebak pilar yang dipakai di tiap cerita.',[L('dek'),L('pol'),L('abs'),L('alg')],[
{q:'Kelas kotor. Bu Guru membagi tugas: Ani menyapu, Budi mengepel, Cici merapikan meja.',e:'🧹',o:pp('dek'),w:'Masalah besar dipecah menjadi tugas-tugas kecil.'},
{q:'Rani melihat bahwa setiap sore mendung, lalu hujan turun. Ia jadi tahu kapan harus membawa payung.',e:'🌧️',o:pp('pol'),w:'Rani menemukan kesamaan yang berulang.'},
{q:'Denah sekolah hanya menggambar ruang kelas, lapangan, dan gerbang. Pohon dan sepeda tidak digambar.',e:'🗺️',o:pp('abs'),w:'Denah hanya memuat hal yang penting.'},
{q:'Resep nasi: cuci beras, tambah air, tekan tombol masak, tunggu matang.',e:'🍚',o:pp('alg'),w:'Langkah-langkahnya disusun berurutan.'},
{q:'Doni sadar bahwa lonceng istirahat selalu berbunyi pukul 09.30 setiap hari.',e:'🔔',o:pp('pol'),w:'Kejadian yang berulang membentuk pola.'},
{q:'Membuat mading kelas dibagi menjadi: mencari berita, menulis, menghias, dan menempel.',e:'📰',o:pp('dek'),w:'Pekerjaan besar dipecah menjadi bagian kecil.'}],
'Kamu sudah mengenal 4 pilar berpikir komputasional!'],
['🧩','Pecah dan Cari Pola','Dekomposisi dan pengenalan pola','Pilar pertama dan kedua: memecah masalah dan menemukan pola.',[L('dek'),L('pol')],[
{q:'Kamu ingin membuat pesta ulang tahun. Bagian kecil yang tepat adalah…',e:'🎂',o:['Menyiapkan makanan, dekorasi, dan undangan','Tidur siang sepanjang hari','Menonton televisi saja','Menunggu orang lain datang'],w:'Pesta besar dibagi menjadi tugas-tugas kecil.'},
{q:'Lengkapi polanya: 🔴 🔵 🔴 🔵 🔴 ❓',o:['🔵','🔴','🟢','🟡'],w:'Warnanya bergantian merah dan biru.'},
{q:'Lengkapi polanya: 2, 4, 6, 8, …',o:['10','9','12','7'],w:'Setiap bilangan bertambah 2.'},

/* ===== mesin misi ===== */
function run(i,ti,intro,learn,items,after){
 A.innerHTML=`${hdr(ti)}<h2>${ti}</h2><p class="intro">${intro}</p><div class="learn"></div><button class="go" id="st">Mulai!</button>`;
 const l=A.querySelector('.learn');
 learn.forEach(c=>l.append($(`<div class="pc"><span style="font-size:44px">${c[0]}</span><b>${c[1]}</b><p>${c[2]}</p></div>`)));
 A.querySelector('#st').onclick=()=>{let r=0;
  const q=()=>{
   if(r>=items.length)return finish(i,after);
   const it=items[r],lock={v:0};
   const T=`${hdr(ti+' ('+(r+1)+'/'+items.length+')')}<div class="qe">${it.e||''}</div><h2>${it.q}</h2>`;
   if(it.s){let n=0;
    A.innerHTML=T+'<ol class="sl"></ol><div class="opts"></div><p id="msg" class="msg"></p>';
    const sl=A.querySelector('.sl'),o=A.querySelector('.opts');
    shuffle(it.s.map((t,j)=>[t,j])).forEach(([t,j])=>{const b=$(`<button>${t}</button>`);
     b.onclick=()=>{if(b.disabled)return;
      if(j===n){n++;b.disabled=true;b.style.display='none';sl.append($(`<li>${t}</li>`));snd(520);
       if(n>=it.s.length){ok();add();msg('Urutannya sudah benar!','',1);setTimeout(()=>{r++;q()},1800)}}
      else{no();shake(b);msg('Belum urut. Langkah mana yang dikerjakan lebih dulu?','')}};
     o.append(b)})
   }else{
    A.innerHTML=T+'<div class="opts"></div><p id="msg" class="msg"></p>';
    const o=A.querySelector('.opts');
    shuffle(it.o.map((t,j)=>[t,j])).forEach(([t,j])=>{const b=$(`<button>${t}</button>`);
     b.onclick=()=>{if(lock.v||b.disabled)return;
      if(j===0){lock.v=1;ok();add();b.classList.add('ok');msg('Benar! '+(it.w||''),'',1);setTimeout(()=>{r++;q()},it.w?2600:1200)}
      else{no();shake(b);b.classList.add('dim');b.disabled=true;msg('Belum tepat. Coba lagi ya!','')}};
     o.append(b)})}
  };q()}}

/* menu */
function home(){
 if(!me)return start();
 save();
 A.innerHTML=`<h1>Halo, ${esc(me.nama)}!</h1><p class="sub">Pilih satu misi. Kerjakan dari Misi 1 sampai 6.</p><div class="menu"></div><button class="mb wide" id="xt"><span>📝</span><b>Exit Ticket &amp; Refleksi</b>${et?'<em>✅</em>':''}</button><p style="text-align:center;margin-top:18px"><button class="back" onclick="gantiSiswa()">Ganti siswa</button> ${BEBAS?'':'<button class="back" onclick="teacher()">Untuk guru</button>'}</p>`;
 const m=A.querySelector('.menu');
 MS.forEach((x,i)=>{const b=$(`<button class="mb"><span>${x[0]}</span><b>Misi ${i+1}</b><small>${x[1]}</small>${done[i]?'<em>✅</em>':''}</button>`);
  b.onclick=()=>{cur=i;ms[i]={s:0,x:0};recalc();run(i,'Misi '+(i+1)+' · '+x[1],x[3],x[4],x[5],x[6])};m.append(b)});
 A.querySelector('#xt').onclick=exitTicket;
 if(Object.keys(done).length>=6)m.before($(`<div class="card" style="margin-bottom:14px"><div class="big">🏆</div><h2>Kamu Jagoan Berpikir Komputasional! ⭐ ${stars}/${MAX}</h2></div>`));
}
function finish(i,text){done[i]=1;add(2);ok();save();
 const all=Object.keys(done).length>=6;
 A.innerHTML=`<div class="card"><div class="big">${all?'🏆':'🎉'}</div><h2>${all?'Kamu Jagoan Berpikir Komputasional, '+esc(me.nama)+'!':'Hebat!'}</h2><p>${text}</p>${all?`<p><b>Skor akhir: ⭐ ${stars} / ${MAX}</b></p>`:''}<button class="go" onclick="home()">Kembali ke menu</button></div>`}

/* Exit Ticket & Refleksi */
function exitTicket(){
 let pk=null,tries=0,hinted=0;
 const N='Exit Ticket &amp; Refleksi';
 const bl=t=>t?`<span class="blank f">${t}</span>`:'<span class="blank">&nbsp;</span>';
 const s1=f=>`Hari ini aku belajar bahwa ${bl(pk&&PIL[pk][1])} dipakai untuk ${bl(f&&PIL[pk][2])}.`;
 const s2=a=>`Satu masalah sehari-hari yang bisa aku pecahkan adalah ${bl(a)}.`;
 const intro='<p class="intro">Di sini tidak ada bintang. Ini untuk menunjukkan apa yang kamu pelajari.</p>';
 const step1=()=>{
  A.innerHTML=`${hdr(N+' (1/3)')}${intro}<div class="sent">${s1(false)}</div><h2>Pilih satu pilar untuk diceritakan.</h2><div class="grid"></div>`;
  const g=A.querySelector('.grid');
  Object.keys(PIL).forEach(k=>{const c=$(`<button class="pc"><span style="font-size:44px">${PIL[k][0]}</span><b>${PIL[k][1]}</b></button>`);c.onclick=()=>{pk=k;step2()};g.append(c)})};
 const step2=()=>{
  let lock=0,wrong=0;const bm={};
  A.innerHTML=`${hdr(N+' (2/3)')}${intro}<div class="sent" id="s">${s1(false)}</div><h2>Untuk apa ${PIL[pk][1]} dipakai? Pilih satu.</h2><div class="opts"></div><p id="msg" class="msg"></p>`;
  const o=A.querySelector('.opts'),fill=()=>{A.querySelector('#s').innerHTML=s1(true)};
  shuffle(Object.keys(PIL)).forEach(k=>{const b=$(`<button>${PIL[k][2]}</button>`);bm[k]=b;
   b.onclick=()=>{if(lock||b.disabled)return;
    if(k===pk){lock=1;ok();b.classList.add('ok');fill();msg('Bagus!','',1);setTimeout(step3,1800);return}
    tries++;wrong++;lock=1;snd(180,.2);shake(b);b.classList.add('dim');b.disabled=true;o.classList.add('lk');
    if(wrong>=2){hinted=1;bm[pk].classList.add('ok');fill();msg('Ini jawabannya. Ayo lanjut!','',1);setTimeout(step3,3000)}
    else{msg('Baca lagi kartu pilarnya.','');setTimeout(()=>{lock=0;o.classList.remove('lk')},2000)}};
   o.append(b)})};
 const step3=()=>{
  const lock={v:0};
  A.innerHTML=`${hdr(N+' (3/3)')}${intro}<div class="sent" id="s">${s2(null)}</div><h2>Pilih satu masalah yang bisa kamu pecahkan.</h2><div class="opts"></div>`;
  const o=A.querySelector('.opts');
  ['membagi tugas piket kelas','menyusun jadwal belajar','merapikan kamar yang berantakan','menyiapkan tas sekolah'].forEach(a=>{
   const b=$(`<button>${a}</button>`);
   b.onclick=()=>{if(lock.v)return;lock.v=1;ok();b.classList.add('ok');A.querySelector('#s').innerHTML=s2(a);setTimeout(()=>step4(a),1500)};
   o.append(b)})};
 const step4=a=>{
  et={p:PIL[pk][1],f:PIL[pk][2],a:a,all:[a],x:tries,h:hinted,done:1};save();
  A.innerHTML=`<div class="card"><div class="big">📝</div><h2>Tiket Keluarku</h2><div class="sent">Hari ini aku belajar bahwa <b>${PIL[pk][1]}</b> dipakai untuk <b>${PIL[pk][2]}</b>.</div><div class="sent">Satu masalah sehari-hari yang bisa aku pecahkan adalah <b>${a}</b>.</div><p>Siap berbagi? Bacakan kalimatmu di depan kelas!</p><button class="go" onclick="home()">Kembali ke menu</button></div>`};
 step1()}
start();
</script></body></html>
